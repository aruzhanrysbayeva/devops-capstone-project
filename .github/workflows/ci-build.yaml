name: CI Build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics
      - name: Unit tests and coverage
        run: nosetests --cover-min-percentage=95

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t accounts:ci .
      - name: Smoke test the non-root image
        run: |
          docker run -d --name accounts-ci -p 127.0.0.1:8080:8080 \
            -e DATABASE_URI=sqlite:////tmp/accounts-ci.sqlite accounts:ci
          curl --fail --max-time 5 --retry 20 --retry-all-errors --retry-delay 1 \
            -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/health
          curl --fail -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/accounts
          test "$(docker exec accounts-ci id -u)" != 0
      - name: Container logs
        if: always()
        run: docker logs accounts-ci || true
