apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean only the dedicated pipeline workspace before cloning.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        case "$WORKSPACE_SOURCE_PATH" in
          ""|"/") echo "Refusing to clean an unsafe workspace path" >&2; exit 1 ;;
        esac
        find "$WORKSPACE_SOURCE_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run the account tests with coverage against an isolated test database.
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      description: Arguments to pass to nosetests
      default: -v --with-spec --spec-color --cover-min-percentage=95
    - name: database_uri
      type: string
      default: sqlite:////tmp/accounts-test.sqlite
      description: Dedicated test database; never point this at the deployed account database
  steps:
    - name: nosetests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
        - name: PIP_NO_CACHE_DIR
          value: "1"
      script: |
        #!/usr/bin/env sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt
        nosetests $(params.args)
